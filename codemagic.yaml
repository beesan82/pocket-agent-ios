# Codemagic: signed build → TestFlight (FR-13, AT-13).
# Started manually from the Codemagic UI only (no `triggering`), to save build minutes.
#
# One-time setup (done by the user in Codemagic / App Store Connect; no secrets in this repo):
#   1. Teams → Integrations → Developer Portal: add an App Store Connect API key
#      (role: App Manager) and name the integration exactly "Pocket Agent ASC".
#   2. App Store Connect: create the app record with the bundle ID below,
#      then put its numeric Apple ID into APP_STORE_APPLE_ID.
#   3. Codemagic does NOT create signing files during the build. `ios_signing` only picks
#      matching files already in Settings → codemagic.yaml settings → Code signing identities:
#      an Apple Distribution certificate (Generate certificate) and an App Store profile for
#      the bundle ID (create it in the Apple Developer portal, then Fetch profiles).
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Pocket Agent ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.beesan82.pocketagent
      vars:
        XCODE_PROJECT: PocketAgent.xcodeproj
        XCODE_SCHEME: PocketAgent
        APP_STORE_APPLE_ID: "6824194188"
      xcode: "27.0"
    scripts:
      - name: Install Metal toolchain (Xcode 26 ships it as a separate component; MLX compiles .metal files)
        script: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version
      - name: Generate Xcode project (XcodeGen) with pinned packages
        script: |
          brew install xcodegen
          xcodegen generate
          mkdir -p "$XCODE_PROJECT/project.xcworkspace/xcshareddata/swiftpm"
          cp App/Package.resolved \
            "$XCODE_PROJECT/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - name: Resolve packages
        script: |
          # Trust package macros (MLXHuggingFace) non-interactively, also for the archive step.
          # ("Validatation" is Xcode's own spelling of this key.)
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -skipMacroValidation -skipPackagePluginValidation
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number (latest TestFlight build + 1)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST + 1))
      - name: Build signed ipa
        # "=" form: argparse rejects a separate value that starts with "-".
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" \
            --archive-flags="-skipMacroValidation -skipPackagePluginValidation"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Internal testing needs no Beta App Review; true failed post-processing on build 2
        # (external review needs test info). Internal group gets builds via automatic distribution.
        submit_to_testflight: false
