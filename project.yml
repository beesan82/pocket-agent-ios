name: PocketAgent
options:
  bundleIdPrefix: com.beesan82
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Lets Codemagic set the build number with agvtool (codemagic.yaml).
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: ""

packages:
  # Fork of AgentRunKit 6.1.0 without AgentRunKitMLX and its mlx-swift-lm 2.30.x pin (ADR-036).
  AgentRunKit:
    url: https://github.com/beesan82/AgentRunKit.git
    exactVersion: 6.1.0-pocket.1
  # On-device models through Foundation Models: MLXFoundationModels (MLXLanguageModel), ADR-036/037.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  # Same revision as mlx-swift-lm's pin; listed so the app can read Memory.activeMemory.
  MLX:
    url: https://github.com/ml-explore/mlx-swift.git
    exactVersion: 0.32.3
  # Download (HubClient) and tokenizer loading (#huggingFaceTokenizerLoader) for MLX models.
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    exactVersion: 0.13.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5
  PocketAgentCore:
    path: Packages/PocketAgentCore
  PocketAgentRuntime:
    path: Packages/PocketAgentRuntime

targets:
  PocketAgent:
    type: application
    platform: iOS
    sources:
      - App/PocketAgent
    dependencies:
      - package: PocketAgentCore
      - package: PocketAgentRuntime
      - package: AgentRunKit
        product: AgentRunKit
      - package: mlx-swift-lm
        product: MLXFoundationModels
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: MLX
        product: MLX
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beesan82.pocketagent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket Agent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Only standard HTTPS: exempt from export compliance, so TestFlight does not ask each upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 日誌を音声で記録するためにマイクを使用します
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 録音した音声を端末内で文字に起こすために使用します
        # Meeting mode keeps recording and transcribing while the phone is locked.
        INFOPLIST_KEY_UIBackgroundModes: audio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  PocketAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/PocketAgentTests
    dependencies:
      - target: PocketAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beesan82.pocketagent.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PocketAgent:
    build:
      targets:
        PocketAgent: all
        PocketAgentTests: [test]
    test:
      targets:
        - PocketAgentTests
