name: PocketAgent
options:
  bundleIdPrefix: com.beesan82
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Lets Codemagic set the build number with agvtool (codemagic.yaml).
    VERSIONING_SYSTEM: apple-generic
    DEVELOPMENT_TEAM: ""

packages:
  AgentRunKit:
    url: https://github.com/Tom-Ryder/AgentRunKit.git
    exactVersion: 6.1.0
  # Same revision as the transitive pin (Package.resolved); listed so the app can link the MLX product.
  MLX:
    url: https://github.com/ml-explore/mlx-swift.git
    exactVersion: 0.30.6
  # Same revisions as the transitive pins; listed so the app can import MLXLMCommon / Hub (Task 4 loader/downloader).
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 2.30.6
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.1.9
  PocketAgentCore:
    path: Packages/PocketAgentCore
  PocketAgentRuntime:
    path: Packages/PocketAgentRuntime

targets:
  PocketAgent:
    type: application
    platform: iOS
    sources:
      - App/PocketAgent
    dependencies:
      - package: PocketAgentCore
      - package: PocketAgentRuntime
      - package: AgentRunKit
        product: AgentRunKit
      - package: AgentRunKit
        product: AgentRunKitFoundationModels
      - package: AgentRunKit
        product: AgentRunKitMLX
      - package: MLX
        product: MLX
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Hub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beesan82.pocketagent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket Agent
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Only standard HTTPS: exempt from export compliance, so TestFlight does not ask each upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 日誌を音声で記録するためにマイクを使用します
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 録音した音声を端末内で文字に起こすために使用します
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  PocketAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/PocketAgentTests
    dependencies:
      - target: PocketAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beesan82.pocketagent.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PocketAgent:
    build:
      targets:
        PocketAgent: all
        PocketAgentTests: [test]
    test:
      targets:
        - PocketAgentTests
